controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    xarm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    uf_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    rg6_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    slider_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_state_broadcaster:
  ros__parameters:
    interfaces:
      - position
      - velocity
      - effort

xarm_controller:
  ros__parameters:
    joints:
      - xarm5_joint1
      - xarm5_joint2
      - xarm5_joint3
      - xarm5_joint4
      - xarm5_joint5
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    open_loop_control: true
    allow_nonzero_velocity_at_trajectory_end: true

uf_controller:
  ros__parameters:
    joints:
      - u1_joint1
      - u1_joint2
      - u1_joint3
      - u1_joint4
      - u1_joint5
      - u1_joint6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    open_loop_control: true
    allow_nonzero_velocity_at_trajectory_end: true

rg6_controller:
  ros__parameters:
    joints:
      - rg6_l_out
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_nonzero_velocity_at_trajectory_end: true

slider_controller:
  ros__parameters:
    joints:
      - slider_slider_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_nonzero_velocity_at_trajectory_end: true